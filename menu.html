<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="description"
    content="Yüce Tat Çiğ Köfte dijital menüsü"
  >

  <meta name="theme-color" content="#050301">

  <title>Yüce Tat | Dijital Menü</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #030201;
    }

    body {
      color: #f4d27d;
      font-family: Georgia, "Times New Roman", serif;
      overflow-x: hidden;
    }

    .menu-app {
      position: relative;
      width: min(100%, 900px);
      min-height: 100vh;
      margin: 0 auto;
      padding-bottom: 125px;

      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(154, 92, 10, 0.22),
          transparent 45%
        ),
        #030201;
    }

    .slides {
      position: relative;
      width: 100%;
    }

    .slide {
      display: none;
      width: 100%;
      min-height: calc(100vh - 125px);
      animation: slideReveal 0.65s ease both;
    }

    .slide.active {
      display: block;
    }

    .menu-image {
      display: block;
      width: 100%;
      height: auto;
      min-height: calc(100vh - 125px);
      object-fit: contain;
      object-position: top center;

      filter:
        drop-shadow(0 0 18px rgba(217, 151, 35, 0.14));
    }

    .coming-soon {
      min-height: calc(100vh - 125px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;

      background:
        linear-gradient(
          rgba(3, 2, 1, 0.8),
          rgba(3, 2, 1, 0.93)
        ),
        url("images/arka-plan.png") center / cover no-repeat;
    }

    .coming-soon img {
      width: min(230px, 62vw);
      margin-bottom: 25px;

      filter:
        drop-shadow(0 0 15px rgba(255, 195, 58, 0.4));
    }

    .coming-soon h2 {
      color: #edc264;
      font-size: clamp(30px, 8vw, 52px);
      text-transform: uppercase;
      letter-spacing: 2px;

      text-shadow:
        0 0 13px rgba(255, 180, 45, 0.35);
    }

    .coming-soon p {
      margin-top: 13px;
      color: #c6b184;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
    }

    .navigation {
      position: fixed;
      left: 50%;
      bottom: 0;
      z-index: 50;

      width: min(100%, 900px);
      min-height: 112px;
      transform: translateX(-50%);

      display: grid;
      grid-template-columns: 78px 1fr 78px;
      align-items: center;
      gap: 12px;
      padding:
        13px
        max(14px, env(safe-area-inset-right))
        calc(13px + env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));

      border-top: 1px solid rgba(206, 145, 33, 0.62);

      background:
        linear-gradient(
          180deg,
          rgba(7, 4, 1, 0.91),
          rgba(2, 1, 0, 0.99)
        );

      box-shadow:
        0 -8px 35px rgba(0, 0, 0, 0.76),
        inset 0 1px 0 rgba(255, 222, 143, 0.08);

      backdrop-filter: blur(12px);
    }

    .arrow {
      width: 68px;
      height: 68px;

      display: grid;
      place-items: center;

      border: 1px solid #bb7e1c;
      border-radius: 18px;

      color: #e8b84e;
      background:
        linear-gradient(
          145deg,
          rgba(44, 27, 8, 0.95),
          rgba(5, 3, 1, 0.98)
        );

      box-shadow:
        inset 0 0 15px rgba(255, 197, 70, 0.07),
        0 0 14px rgba(200, 128, 17, 0.1);

      cursor: pointer;
      font-size: 39px;
      line-height: 1;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease,
        box-shadow 0.25s ease;
    }

    .arrow:active {
      transform: scale(0.94);
    }

    .arrow:disabled {
      opacity: 0.28;
      cursor: default;
    }

    .page-status {
      text-align: center;
    }

    .dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      margin-bottom: 9px;
    }

    .dot {
      width: 13px;
      height: 13px;

      border: 1px solid #c88c27;
      border-radius: 50%;

      background: transparent;
      transition:
        background 0.25s ease,
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .dot.active {
      background: #e5ae3e;
      transform: scale(1.12);

      box-shadow:
        0 0 8px rgba(255, 195, 67, 0.7),
        0 0 17px rgba(219, 139, 24, 0.32);
    }

    .counter {
      color: #efc86b;
      font-size: 20px;
      letter-spacing: 2px;
    }

    @keyframes slideReveal {
      from {
        opacity: 0;
        transform: translateX(18px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @media (min-width: 901px) {
      body {
        padding: 0 18px;
      }

      .menu-app {
        box-shadow:
          0 0 50px rgba(0, 0, 0, 0.9);
      }
    }

    @media (max-width: 500px) {
      .menu-app {
        padding-bottom: 105px;
      }

      .slide,
      .menu-image,
      .coming-soon {
        min-height: calc(100vh - 105px);
      }

      .navigation {
        min-height: 96px;
        grid-template-columns: 62px 1fr 62px;
        gap: 8px;
        padding-top: 10px;
      }

      .arrow {
        width: 57px;
        height: 57px;
        font-size: 32px;
        border-radius: 15px;
      }

      .dots {
        gap: 10px;
        margin-bottom: 6px;
      }

      .dot {
        width: 11px;
        height: 11px;
      }

      .counter {
        font-size: 17px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .slide {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <main class="menu-app">

    <section class="slides">

      <!-- 1. SAYFA: DÜRÜMLER -->
      <article class="slide active">
        <img
          src="images/durumler-kapak.png"
          alt="Yüce Tat etsiz dürümler menüsü"
          class="menu-image"
        >
      </article>

      <!-- 2. SAYFA: ETLİ DÜRÜMLER -->
<article class="slide">
  <img
    src="images/etli-durumler-kapak.png"
    alt="Yüce Tat etli dürümler menüsü"
    class="menu-image"
  >
</article>

     <!-- 3. SAYFA: PORSİYONLAR -->
<article class="slide">

    <img
        src="images/porsiyonlar-kapak.png"
        alt="Yüce Tat Porsiyonlar Menüsü"
        class="menu-image"
    >

</article>

     <!-- 4. SAYFA: ETLİ PORSİYONLAR -->
<article class="slide">
  <img
    src="images/etli-porsiyonlar-kapak.png"
    alt="Yüce Tat etli porsiyonlar menüsü"
    class="menu-image"
  >
</article>

<!-- 5. SAYFA: ŞAHANELERİMİZ -->
<article class="slide">
  <img
    src="images/sahanelerimiz-kapak.png"
    alt="Yüce Tat Şahanelerimiz"
    class="menu-image"
  >
</article>
<!-- 6. SAYFA: EV LEZZETLERİMİZ -->
<article class="slide">
  <img
    src="images/ev-lezzetlerimiz-kapak.png"
    alt="Yüce Tat Ev Lezzetlerimiz"
    class="menu-image"
  >
</article>
      <!-- 7. SAYFA: İÇECEKLER -->
<article class="slide">
  <img
    src="images/icecekler-kapak.png"
    alt="Yüce Tat İçecekler"
    class="menu-image"
  >
</article>
    </section>

    <nav class="navigation" aria-label="Menü sayfası geçişleri">

      <button
        type="button"
        class="arrow"
        id="prevButton"
        aria-label="Önceki sayfa"
      >
        ←
      </button>

      <div class="page-status">

        <div class="dots" aria-hidden="true">
          <span class="dot active"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>

        <div class="counter">
          <span id="currentPage">1</span> / 7
        </div>

      </div>

      <button
        type="button"
        class="arrow"
        id="nextButton"
        aria-label="Sonraki sayfa"
      >
        →
      </button>

    </nav>

  </main>

  <script>
    const slides = Array.from(document.querySelectorAll(".slide"));
    const dots = Array.from(document.querySelectorAll(".dot"));

    const previousButton = document.getElementById("prevButton");
    const nextButton = document.getElementById("nextButton");
    const currentPage = document.getElementById("currentPage");

    let activeIndex = 0;

    function showSlide(index) {
      activeIndex = index;

      slides.forEach((slide, slideIndex) => {
        slide.classList.toggle("active", slideIndex === activeIndex);
      });

      dots.forEach((dot, dotIndex) => {
        dot.classList.toggle("active", dotIndex === activeIndex);
      });

      currentPage.textContent = activeIndex + 1;

      previousButton.disabled = activeIndex === 0;
      nextButton.disabled = activeIndex === slides.length - 1;

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    previousButton.addEventListener("click", () => {
      if (activeIndex > 0) {
        showSlide(activeIndex - 1);
      }
    });

    nextButton.addEventListener("click", () => {
      if (activeIndex < slides.length - 1) {
        showSlide(activeIndex + 1);
      }
    });

    showSlide(0);
  </script>

</body>
</html>
