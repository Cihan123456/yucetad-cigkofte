<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yüce Tat</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#111;
font-family:Arial,Helvetica,sans-serif;
overflow:hidden;
}

img{
width:320px;
max-width:85%;
animation:fade 2s ease forwards;
opacity:0;
}

@keyframes fade{
from{
opacity:0;
transform:scale(.8);
}
to{
opacity:1;
transform:scale(1);
}
}

</style>

</head>

<body>

<img src="images/logo.png" alt="Yüce Tat Logo">

</body>
</html>
